<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zumba Run - a retro endless runner in a single HTML file. Jump, shoot, collect coins and power-ups across desert, ice, lava and night biomes.">
  <title>Zumba Run — Retro Endless Runner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body {
      background: linear-gradient(135deg, #78d6ff, #4ac0f2); /* Vibrant Sky Blue */
      transition: background 3s ease-in-out, color 3s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
      /* Removed gap for leaderboard */
    }
    #game {
      background: linear-gradient(to bottom, #a7e9af, #76c78f); /* Fresh Green Ground */
      border: 2px solid #4f9a65; /* Deeper Green Border */
      transition: background 3s ease-in-out, border-color 3s ease-in-out, box-shadow 3s ease-in-out, background-image 3s ease-in-out;
      width: 1200px;
      height: 300px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
    #dino {
      position: absolute;
      left: 50px;
      bottom: 0;
      width: 32px;
      height: 32px;
      background: linear-gradient(to bottom, #ff9800, #f57c00); /* Orange gradient */
      border-radius: 50% 50% 40% 40%; /* Goomba shape */
      border: 2px solid #e65100; /* Dark orange border */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); /* Standard shadow */
      transform-origin: bottom center;
      transition: transform 0.1s ease-out;
      animation: jellyWobble 2s infinite ease-in-out;
    }
    #dino.jumping {
      animation: jumpSquish 0.5s ease-in-out, slashEffect 0.5s ease-in-out;
    }
    #dino.landing {
      animation: landSquish 0.3s ease-out, jellySplash 0.3s ease-out;
    }
    /* Black eyes */
    #dino:before {
      content: '';
      position: absolute;
      top: 9px; /* Position for Goomba eyes */
      left: 8px; /* Position for Goomba eyes */
      width: 5px; /* Goomba eye size */
      height: 5px; /* Goomba eye size */
      background: #000; /* Black eyes */
      border-radius: 50%; /* Circular eye */
      box-shadow: 
        16px 0 0 #000; /* Second eye */
      animation: eyeShine 2s infinite ease-in-out alternate;
    }
    /* Pupil effect */
    #dino:after {
      content: '';
      position: absolute;
      top: 10px; /* Position for Goomba mouth */
      left: 10px; /* Position for Goomba mouth */
      width: 12px; /* Goomba mouth size */
      height: 12px; /* Goomba mouth size */
      background: #ffb300; /* Yellow-orange mouth */
      border-radius: 50%; /* Circular mouth */
      box-shadow: 0 2px 4px rgba(255, 179, 0, 0.5); /* Yellow-orange shadow */
    }
    @keyframes eyeShine {
      0% { box-shadow: 
        16px 0 0 #000;
      }
      100% { box-shadow: 
        16px 0 0 #000;
      }
    }
    @keyframes eyeLook {
      0%, 100% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(1px) translateY(0); }
      50% { transform: translateX(0) translateY(1px); }
      75% { transform: translateX(-1px) translateY(0); }
    }
    /* Enhanced mouth */
    #dino .mouth {
      display: none; /* Remove the old mouth element */
    }
    /* Mouth shine */
    #dino .mouth:after {
      /* Remove mouth shine */
    }
    @keyframes jumpSquish {
      0% { transform: scaleY(1) scaleX(1); }
      10% { transform: scaleY(0.7) scaleX(1.3) rotate(-5deg); }
      20% { transform: scaleY(1.3) scaleX(0.7) rotate(5deg); }
      30% { transform: scaleY(1) scaleX(1) rotate(0deg); }
      100% { transform: scaleY(1) scaleX(1); }
    }
    @keyframes landSquish {
      0% { transform: scaleY(1.3) scaleX(0.7) rotate(5deg); }
      50% { transform: scaleY(0.7) scaleX(1.3) rotate(-5deg); }
      100% { transform: scaleY(1) scaleX(1); }
    }
    .obstacle {
      position: absolute;
      bottom: 0;
      border-radius: 3px;
      transition: background 0.2s;
      animation: obstacleFloat 3s ease-in-out infinite alternate, obstacleShake 0.5s infinite, obstacleEntry 0.5s ease-out;
    }
    @keyframes obstacleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .obstacle.pipe {
      width: 20px;
      height: 40px;
      background: #c62828; /* Dark Red */
      border-bottom: 6px solid #b71c1c; /* Even Darker Red */
    }
    .obstacle.bush {
      width: 30px;
      height: 25px;
      background: #FF9800; /* Orange */
      border-radius: 15px 15px 15px 15px / 20px 20px 10px 10px;
      border: 2px solid #F57C00; /* Darker Orange */
    }
    .obstacle.spike {
      width: 20px;
      height: 30px;
      background: #E91E63; /* Pink */
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      border: 2px solid #C2185B; /* Darker Pink */
    }
    /* New unique obstacles */
    .obstacle.ghost {
      width: 24px;
      height: 32px;
      background: #9C27B0; /* Purple */
      border-radius: 50% 50% 0 0;
      box-shadow: 0 0 8px rgba(156, 39, 176, 0.5); /* Purple shadow */
      animation: float 1.5s infinite;
    }
    .obstacle.ghost:before {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 8px;
      background: #9C27B0; /* Purple */
      clip-path: polygon(0% 0%, 25% 100%, 50% 0%, 75% 100%, 100% 0%);
    }
    .obstacle.fire {
      width: 20px;
      height: 35px;
      background: linear-gradient(to top, #FFEB3B, #FBC02D); /* Yellow Fire */
      border-radius: 10px 10px 0 0;
      animation: flicker 0.5s infinite;
    }
    .obstacle.fire:before {
      content: '';
      position: absolute;
      top: -5px;
      left: 0;
      width: 100%;
      height: 10px;
      background: #FFEB3B; /* Yellow */
      border-radius: 50%;
      filter: blur(2px);
    }
    .obstacle.ice {
      width: 25px;
      height: 30px;
      background: linear-gradient(45deg, #4FC3F7, #29B6F6); /* Light to Standard Blue */
      border: 2px solid #B3E5FC; /* Lighter Blue */
      border-radius: 5px;
      animation: sparkle 1s infinite;
    }
    .obstacle.ice:before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.9) 50%, transparent 55%); /* Brighter shine */
      animation: shine 2s infinite;
    }
    /* Added Obstacles */
    .obstacle.rock {
      width: 25px;
      height: 20px;
      background: #795548; /* Brown */
      border-radius: 40% 40% 30% 30%;
      border: 2px solid #5D4037; /* Darker Brown */
    }
    .obstacle.cloud-obstacle {
      width: 50px;
      height: 30px;
      background: rgba(255, 255, 255, 0.7); /* White semi-transparent clouds */
      border-radius: 50% / 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4); /* White shadow */
      bottom: 100px; /* Positioned higher */
      animation: cloudObstacleMove 10s linear infinite;
    }
    @keyframes cloudObstacleMove {
      0% { left: 100%; }
      100% { left: -20%; }
    }
    .obstacle.bat {
      width: 30px;
      height: 20px;
      background: #212121; /* Dark Grey */
      clip-path: polygon(0% 0%, 20% 100%, 50% 50%, 80% 100%, 100% 0%, 60% 50%, 50% 0%, 40% 50%);
      bottom: 120px; /* Positioned high */
      animation: batFly 2s ease-in-out infinite alternate;
    }
    @keyframes batFly {
      0%, 100% { transform: translateY(0) rotateY(0); }
      50% { transform: translateY(-10px) rotateY(180deg); }
    }
    .obstacle.moon-obstacle {
      width: 30px;
      height: 30px;
      background: #f0f0f0; /* Light grey */
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(240, 240, 240, 0.5); /* Gentle glow */
      bottom: 140px; /* Positioned very high */
      animation: moonObstacleFloat 4s ease-in-out infinite alternate;
    }
    @keyframes moonObstacleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    @keyframes sparkle {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }
    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%); }
      100% { transform: translateX(100%) translateY(100%); }
    }
    /* More Animations */
    @keyframes scoreValuePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes obstacleShake {
      0%, 100% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(-1px) translateY(1px); }
      50% { transform: translateX(0) translateY(2px); }
      75% { transform: translateX(1px) translateY(1px); }
    }
    @keyframes gameBackgroundPulse {
      0%, 100% { background-size: 100% 100%; }
      50% { background-size: 105% 105%; }
    }
    @keyframes coinSpin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    @keyframes idleBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.01); }
    }
    @keyframes obstacleEntry {
      0% { opacity: 0; transform: translateX(20px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes borderPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); }
      50% { box-shadow: 0 0 30px rgba(0, 0, 0, 0.7); }
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      font-family: 'Press Start 2P', monospace, Arial, sans-serif;
      font-size: 20px;
      color: #ffffff; /* White text */
      background: rgba(33, 150, 243, 0.8); /* Blue semi-transparent background */
      border: 2px solid #1976D2; /* Darker blue border */
      transition: color 3s ease-in-out, background 3s ease-in-out, border-color 3s ease-in-out, box-shadow 3s ease-in-out;
      border-radius: 5px; /* Standard radius */
      padding: 5px 15px 5px 8px; /* Standard padding */
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      letter-spacing: 2px;
      text-shadow: none;
      animation: scorePulse 2s infinite alternate, scoreValuePulse 1.5s infinite ease-in-out;
    }
    @keyframes scorePulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.02); }
    }
    #score .coin {
      display: inline-block;
      width: 22px;
      height: 22px;
      margin-right: 8px;
      background: radial-gradient(circle at 60% 40%, #FFC107 60%, #FFB300 100%); /* Amber gradient */
      border: 2px solid #FFA000; /* Darker Amber border */
      transition: background 3s ease-in-out, border-color 3s ease-in-out, transform 3s ease-in-out, box-shadow 3s ease-in-out;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      position: relative;
      animation: coinSpin 4s linear infinite;
    }
    #score .coin:after {
      content: '';
      position: absolute;
      left: 8px;
      top: 4px;
      width: 6px;
      height: 14px;
      background: rgba(255,255,255,0.8); /* Slightly more transparent white highlight */
      border-radius: 3px;
      opacity: 0.6;
    }
    #gameover {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Press Start 2P', monospace;
      font-size: 32px;
      color: #fff; /* White */
      background: rgba(0, 0, 0, 0.8); /* Black semi-transparent */
      padding: 20px 40px;
      border-radius: 10px;
      border: 3px solid #ff0000; /* Red */
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); /* Red shadow */
      text-shadow: 2px 2px 0px #000; /* Black text shadow */
      letter-spacing: 2px;
      display: none;
      transition: color 3s ease-in-out, background 3s ease-in-out, border-color 3s ease-in-out, box-shadow 3s ease-in-out, text-shadow 3s ease-in-out, transform 3s ease-in-out, opacity 3s ease-in-out;
      animation: gameoverFadeIn 0.5s ease-out;
      z-index: 100;
    }
    @keyframes gameoverFadeIn {
      0% { 
        opacity: 0; 
        transform: translate(-50%, -50%) scale(0.5);
        filter: blur(10px);
      }
      100% { 
        opacity: 1; 
        transform: translate(-50%, -50%) scale(1);
        filter: blur(0);
      }
    }
    #gameover span {
      display: block;
      font-size: 16px;
      margin-top: 15px;
      color: #ffcc00;
      text-align: center;
      animation: pulseText 1.5s infinite ease-in-out;
    }
    @keyframes pulseText {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.8); /* More opaque white clouds */
      border-radius: 50% / 50%; /* Ensure oval shape based on different width/height */
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.5); /* More prominent white shadow */
      transition: background 3s ease-in-out, box-shadow 3s ease-in-out, opacity 3s ease-in-out;
      filter: blur(1px);
      animation: cloudMove 30s linear infinite;
    }
    @keyframes cloudMove {
      0% { left: 100%; }
      100% { left: -20%; }
    }
    .cloud:nth-child(1) {
      width: 60px;
      height: 20px;
      top: 30px;
      left: 110%; /* Start off screen */
    }
    .cloud:nth-child(2) {
      width: 80px;
      height: 25px;
      top: 50px;
      left: 120%; /* Start off screen */
    }
    .cloud:nth-child(3) {
      width: 70px;
      height: 22px;
      top: 40px;
      left: 130%; /* Start off screen */
    }
    .hill {
      position: absolute;
      bottom: 0;
      background: rgba(139, 195, 74, 0.8); /* Light Green semi-transparent hills */
      box-shadow: 0 0 12px rgba(139, 195, 74, 0.5); /* More prominent Light Green shadow */
      border-radius: 50% 50% 0 0;
      transition: background 3s ease-in-out, box-shadow 3s ease-in-out, opacity 3s ease-in-out;
      animation: hillMove 40s linear infinite;
    }
    @keyframes hillMove {
      0% { left: 100%; }
      100% { left: -20%; }
    }
    .hill:nth-child(1) {
      width: 100px;
      height: 50px;
      left: 110%; /* Start off screen */
    }
    .hill:nth-child(2) {
      width: 120px;
      height: 60px;
      left: 140%; /* Start off screen */
    }
    /* Desert Theme */
    body.theme-desert {
      background: linear-gradient(135deg, #ffeb3b, #fbc02d); /* Yellow 400 to Yellow 700 */
      transition: background 3s ease-in-out, color 3s ease-in-out;
      animation: desertWind 10s infinite ease-in-out alternate; /* Apply wind to body background */
      position: relative;
      overflow: hidden;
    }
    body.theme-desert #game {
      background: linear-gradient(to bottom, #ffa726, #f57c00); /* Orange 400 to Orange 700 */
      border: 2px solid #ef6c00; /* Orange 800 */
      transition: background 3s ease-in-out, border-color 3s ease-in-out, box-shadow 3s ease-in-out, background-image 3s ease-in-out;
      animation: gameBackgroundPulse 10s infinite alternate, borderPulse 4s infinite alternate, sandstormGame 8s linear infinite;
      position: relative;
    }
    body.theme-desert .cloud {
      background: rgba(255, 249, 196, 0.9); /* Yellow 50 semi-transparent clouds */
      box-shadow: 0 0 10px rgba(255, 249, 196, 0.6); /* Yellow 50 shadow */
      transition: background 3s ease-in-out, box-shadow 3s ease-in-out, opacity 3s ease-in-out;
      animation: cloudMove 30s linear infinite, desertWind 5s infinite ease-in-out alternate; /* Combine cloud move with wind */
    }
    body.theme-desert .hill {
      background: rgba(188, 170, 164, 0.9); /* Brown 200 semi-transparent hills */
      box-shadow: 0 0 10px rgba(188, 170, 164, 0.6); /* Brown 200 shadow */
      transition: background 3s ease-in-out, box-shadow 3s ease-in-out, opacity 3s ease-in-out;
      animation: hillMove 40s linear infinite, desertWind 7s infinite ease-in-out alternate; /* Combine hill move with wind */
    }
    body.theme-desert #score {
      color: #4e342e; /* Brown 900 text */
      background: rgba(255, 224, 178, 0.9); /* Orange 100 semi-transparent background */
      border: 2px solid #ffb74d; /* Orange 200 border */
      transition: color 3s ease-in-out, background 3s ease-in-out, border-color 3s ease-in-out, box-shadow 3s ease-in-out;
      animation: scoreValuePulse 1.5s infinite ease-in-out;
    }
    body.theme-desert #score .coin {
      background: radial-gradient(circle at 60% 40%, #ffcc80 60%, #ffb74d 100%); /* Orange 200 to Orange 300 */
      border: 2px solid #ff9800; /* Orange 500 border */
      transition: background 3s ease-in-out, border-color 3s ease-in-out, transform 3s ease-in-out, box-shadow 3s ease-in-out;
      animation: coinSpin 4s linear infinite;
    }
    body.theme-desert #gameover {
      color: #bf360c; /* Deep Orange 900 */
      background: rgba(255, 160, 0, 0.9); /* Orange 600 semi-transparent */
      border-color: #f57c00; /* Orange 700 */
      box-shadow: 0 0 20px rgba(245, 124, 0, 0.7); /* Orange 700 shadow */
      text-shadow: 4px 4px 0px #fff, 8px 8px 0px #ff9800; /* White outline and Orange 500 shadow */
      animation: gameoverFadeIn 0.5s ease-out;
    }
    body.theme-desert .obstacle.pipe {
      background: #d32f2f; /* Red 700 */
      border-bottom: 6px solid #c62828; /* Red 800 */
    }
    body.theme-desert .obstacle.bush {
      background: #8d6e63; /* Brown 300 */
      border: 2px solid #795548; /* Brown 400 */
    }
    body.theme-desert .obstacle.spike {
      background: #455a64; /* Blue Grey 700 */
      border: 2px solid #37474f; /* Blue Grey 800 */
    }
    body.theme-desert .obstacle.ghost {
      background: #ef9a9a; /* Red 200 */
      box-shadow: 0 0 8px rgba(239, 154, 154, 0.5); /* Red 200 shadow */
    }
    body.theme-desert .obstacle.ghost:before {
      background: #ef9a9a; /* Red 200 */
    }
    body.theme-desert .obstacle.fire,
    body.theme-desert .obstacle.fire:before {
       /* Fire remains similar */
    }
    body.theme-desert .obstacle.ice {
      background: linear-gradient(45deg, #b0bec5, #90a4ae); /* Blue Grey 200 to Blue Grey 300 */
      border: 2px solid #cfd8dc; /* Blue Grey 100 */
    }
     body.theme-desert .obstacle.ice:before {
       /* Ice shine remains */
     }
     body.theme-desert .obstacle.rock {
       background: #5d4037; /* Brown 700 */
       border: 2px solid #4e342e; /* Brown 800 */
     }
    body.theme-desert .obstacle.cactus {
      width: 20px;
      height: 40px;
      background: linear-gradient(to top, #388e3c, #2e7d32); /* Green 700 to Green 800 */
      border-radius: 5px 5px 0 0;
      border: 2px solid #1b5e20; /* Green 900 */
    }
    /* Lava Theme - Day */
    body.theme-lava {
      background: linear-gradient(135deg, #ff7043, #f4511e); /* Orange 400 to Deep Orange 700 */
      transition: background 3s ease-in-out, color 3s ease-in-out;
      animation: lavaFlow 20s linear infinite;
      position: relative;
      overflow: hidden;
    }
    body.theme-lava #game {
      background: linear-gradient(to bottom, #ff9800, #f57c00); /* Orange 500 to Orange 700 */
      border: 2px solid #ef6c00; /* Orange 800 */
      transition: background 3s ease-in-out, border-color 3s ease-in-out, box-shadow 3s ease-in-out, background-image 3s ease-in-out;
      animation: gameBackgroundPulse 10s infinite alternate, borderPulse 4s infinite alternate, lavaFlowGame 10s linear infinite;
      position: relative;
    }
    body.theme-lava .cloud {
      background: rgba(255, 152, 0, 0.7); /* Orange 500 semi-transparent clouds */
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.5); /* Orange 500 shadow */
      transition: background 3s ease-in-out, box-shadow 3s ease-in-out, opacity 3s ease-in-out;
    }
    body.theme-lava .hill {
      background: rgba(121, 85, 72, 0.9); /* Brown 400 semi-transparent hills */
      box-shadow: 0 0 10px rgba(121, 85, 72, 0.6); /* Brown 400 shadow */
      transition: background 3s ease-in-out, box-shadow 3s ease-in-out, opacity 3s ease-in-out;
      animation: hillMove 40s linear infinite;
    }
    body.theme-lava #score {
      color: #fff; /* White */
      background: rgba(255, 87, 34, 0.9); /* Deep Orange 500 semi-transparent background */
      border: 2px solid #ff5722; /* Deep Orange 500 border */
      animation: scoreValuePulse 1.5s infinite ease-in-out;
    }
    body.theme-lava #score .coin {
      background: radial-gradient(circle at 60% 40%, #ffb74d 60%, #ffa726 100%); /* Orange 300 to Orange 400 */
      border: 2px solid #ff9800; /* Orange 500 border */
      transition: background 3s ease-in-out, border-color 3s ease-in-out, transform 3s ease-in-out, box-shadow 3s ease-in-out;
      animation: coinSpin 4s linear infinite;
    }
    body.theme-lava #gameover {
      color: #ffccbc; /* Peach */
      background: rgba(183, 28, 28, 0.9); /* Red 900 semi-transparent */
      border-color: #e53935; /* Red 600 */
      box-shadow: 0 0 20px rgba(229, 57, 53, 0.7); /* Red 600 shadow */
      text-shadow: 4px 4px 0px #000, 8px 8px 0px #d84315; /* Black outline and Deep Orange 800 shadow */
      animation: gameoverFadeIn 0.5s ease-out;
    }
    /* Lava Theme - Obstacles */
    body.theme-lava .obstacle.lava-rock {
      width: 30px;
      height: 25px;
      background: linear-gradient(to bottom, #ff5722, #e64a19); /* Deep Orange */
      border-radius: 40% 40% 30% 30%;
      border: 2px solid #bf360c; /* Even Darker Deep Orange */
    }
    body.theme-lava .obstacle.fire-geyser {
      width: 20px;
      height: 40px;
      background: linear-gradient(to top, #ffeb3b, #fbc02d); /* Yellow */
      border-radius: 10px 10px 0 0;
      animation: flicker 0.5s infinite;
    }
    body.theme-lava .obstacle.fire-geyser:before {
      content: '';
      position: absolute;
      top: -10px;
      left: -5px;
      width: 30px;
      height: 20px;
      background: radial-gradient(circle, #ffeb3b 0%, #fbc02d 100%);
      border-radius: 50%;
      filter: blur(3px);
    }
    body.theme-lava .obstacle.spike {
      background: #616161; /* Grey 700 */
      border: 2px solid #424242; /* Grey 800 */
    }

  <script>
    const dino = document.getElementById('dino');
    const game = document.getElementById('game');
    const scoreValueEl = document.getElementById('score-value');
    const gameoverEl = document.getElementById('gameover');
    let isJumping = false;
    let jumpVelocity = 0;
    let gravity = 1.1;
    let obstacles = [];
    let score = 0;
    let gameOver = false;
    let lastFrameTime = null;
    let animationFrameId = null;
    let lastObstacleTime = 0;
    const INITIAL_OBSTACLE_INTERVAL = 1500; // ms
    const MIN_OBSTACLE_INTERVAL = 600; // ms
    const SPEED_INCREASE_INTERVAL = 5; // Score interval for speed increase
    const SPEEDUP_FACTOR = 0.9; // Reduce interval to 90% each time
    let currentObstacleInterval = INITIAL_OBSTACLE_INTERVAL;
    let obstacleSpeed = 8; // Initial obstacle speed
    const MAX_OBSTACLE_SPEED = 10; // Maximum obstacle speed (reduced from 15)
    const SPEED_INCREASE_AMOUNT = 0.5; // How much to increase speed by
    // Define the sequence of theme states and their transition scores
    const THEME_STATES = [
      { scoreThreshold: 0, theme: 'default', isNight: false, obstacles: ['pipe', 'bush', 'spike', 'rock', 'cloud-obstacle', 'bird'] }, // Default Day
      { scoreThreshold: 25, theme: 'default', isNight: true, obstacles: ['ghost', 'fire', 'ice', 'bat', 'moon-obstacle'] },   // Default Night
      { scoreThreshold: 50, theme: 'theme-desert', isNight: false, obstacles: ['lava-rock', 'rock', 'spike', 'cloud-obstacle', 'cactus', 'bird'] }, // Desert (using lava-rock/rock/spike/cactus for desert feel)
      { scoreThreshold: 75, theme: 'theme-lava', isNight: false, obstacles: ['lava-rock', 'fire-geyser', 'spike'] },      // Lava Day
      { scoreThreshold: 100, theme: 'theme-lava', isNight: true, obstacles: ['lava-rock', 'fire-geyser', 'bat'] },       // Lava Night
      { scoreThreshold: 125, theme: 'theme-ice', isNight: false, obstacles: ['ice-block', 'snowball', 'spike', 'cloud-obstacle', 'ice-shard', 'bird'] },  // Ice Day
      { scoreThreshold: 150, theme: 'theme-ice', isNight: true, obstacles: ['ice-block', 'snowball', 'bat', 'moon-obstacle', 'ice-shard'] },    // Ice Night
      // Add more states or loop back if needed after this
    ];
    let currentThemeStateIndex = 0;
    let isPaused = false; // Pause state
    let highScore = parseInt(localStorage.getItem('dinoHighScore')) || 0;
    let lives = 4;
    let isProtected = false;
    let protectionTimeout = null;
    let protectionUsesLeft = 3;
    let canDoubleJump = false;
    let hasGun = false;
    let gunTimeout = null;
    let gunTimerInterval = null;
    let gunTimeLeft = 0;
    let gunType = null;

    // Add bird group variables
    let lastBirdGroupTime = 0;
    const BIRD_GROUP_INTERVAL = 30000; // 30 seconds
    const BIRDS_IN_GROUP = 4; // Number of birds in a group

    // Add bat group variables
    let lastBatGroupTime = 0;
    const BAT_GROUP_INTERVAL = 30000; // 30 seconds
    const BATS_IN_GROUP = 3; // Number of bats in a group

    // Function to increase difficulty
    function increaseDifficulty() {
      // Increase obstacle speed
      if (obstacleSpeed < MAX_OBSTACLE_SPEED) {
        obstacleSpeed += SPEED_INCREASE_AMOUNT;
      }
      
      // Decrease obstacle interval
      if (currentObstacleInterval > MIN_OBSTACLE_INTERVAL) {
        currentObstacleInterval = Math.max(MIN_OBSTACLE_INTERVAL, 
          currentObstacleInterval * SPEEDUP_FACTOR);
      }
    }

    const jumpSound = document.getElementById('jumpSound');
    const landSound = document.getElementById('landSound');
    const scoreSound = document.getElementById('scoreSound');
    const gameOverSound = document.getElementById('gameOverSound');

    // Add gun sound elements
    const normalGunSound = new Audio();
    const laserGunSound = new Audio();
    const shotgunSound = new Audio();
    const cannonSound = new Audio();

    // Function to create a simple beep sound
    function createBeepSound(frequency, duration, volume = 0.1) {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.type = 'sine';
      oscillator.frequency.value = frequency;
      gainNode.gain.value = volume;

      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
      oscillator.stop(audioContext.currentTime + duration);
    }

    // Function to play gun sounds with higher volume
    function playNormalGunSound() { createBeepSound(1000, 0.05, 0.3); }
    function playLaserGunSound() { createBeepSound(1500, 0.08, 0.4); }
    function playShotgunSound() { createBeepSound(800, 0.07, 0.5); }
    function playCannonSound() { createBeepSound(600, 0.1, 0.6); }

    // Function to play jump sound
    function playJumpSound() {
      createBeepSound(800, 0.1);
    }

    // Function to play land sound
    function playLandSound() {
      createBeepSound(400, 0.1);
    }

    // Function to play score sound
    function playScoreSound() {
      createBeepSound(1200, 0.1);
    }

    // Function to play game over sound
    function playGameOverSound() {
      createBeepSound(200, 0.5);
    }

    // Modify the jump function to include sound
    function jump() {
      if (!isJumping && !gameOver) {
        isJumping = true;
        jumpVelocity = 18;
        dino.classList.add('jumping');
        playJumpSound();
        setTimeout(() => {
          dino.classList.remove('jumping');
        }, 500);
        canDoubleJump = true;
      } else if (isJumping && canDoubleJump && !gameOver) {
        // Double jump
        jumpVelocity = 16; // Slightly less powerful than first jump
        dino.classList.add('jumping');
        playJumpSound();
        setTimeout(() => {
          dino.classList.remove('jumping');
        }, 500);
        canDoubleJump = false;
      }
    }

    function createObstacle() {
      if (gameOver) return;
      // Prevent spawning too many obstacles at once
      const MAX_SIMULTANEOUS_OBSTACLES = 6;
      if (obstacles.length >= MAX_SIMULTANEOUS_OBSTACLES) return;
      // Ensure a minimum gap between newly spawned obstacles (px)
      const MIN_SPAWN_GAP = 180;
      // If there's a recent obstacle too close to the spawn edge, delay spawn
      for (let i = 0; i < obstacles.length; i++) {
        const left = parseFloat(obstacles[i].style.left) || 0;
        if (left > (1200 - MIN_SPAWN_GAP)) {
          // postpone spawn
          return;
        }
      }
      const obstacle = document.createElement('div');
      obstacle.classList.add('obstacle');
      // Randomly select obstacle type based on day or night
      const types = THEME_STATES[currentThemeStateIndex].obstacles;
      let type;
      // 1 in 20 chance for each gun type, else as before
      const rand = Math.random();
      if (rand < 0.05) {
        type = 'gun-powerup-normal';
      } else if (rand < 0.10) {
        type = 'gun-powerup-laser';
      } else if (rand < 0.15) {
        type = 'gun-powerup-shotgun';
      } else if (rand < 0.20) {
        type = 'gun-powerup-cannon';
      } else if (rand < 0.30) {
        type = 'protection';
      } else if (rand < 0.42) {
        type = 'zombie-ball';
      } else if (rand < 0.54) {
        type = 'running-zombie';
      } else if (rand < 0.66) {
        type = 'spike-ball';
      } else if (rand < 0.76) {
        type = 'mini-zombie';
      } else if (rand < 0.83) {
        type = 'tall-wall';
      } else if (rand < 0.89) {
        type = 'falling-rock';
      } else {
        type = types[Math.floor(Math.random() * types.length)];
      }
      obstacle.classList.add(type);
      // Place at random vertical and horizontal position for gun and protection
      // All hazards/powerups (that move left) should spawn off-screen to the right
      if (type.startsWith('gun-powerup') || type === 'protection') {
        // place powerups at accessible heights but spawn off-screen
        const positions = [20, 100, 180];
        const pos = positions[Math.floor(Math.random() * positions.length)];
        obstacle.style.bottom = pos + 'px';
        obstacle.style.left = (1200 + Math.random() * 220) + 'px';
      } else {
        obstacle.style.left = (1200 + Math.random() * 220) + 'px';
      }
      // Place falling rock at a random horizontal position and start at the top
      if (type === 'falling-rock') {
        // falling rocks appear from the top within the visible field but not too close to dino
        const minX = 200; // avoid spawning too close to player
        const maxX = 1100;
        obstacle.style.left = (minX + Math.random() * (maxX - minX)) + 'px';
        obstacle.style.top = '0px';
        obstacle.style.bottom = '';
      }
      // Birds should be positioned higher and have speed variations
      if (type === 'bird') {
        if (Math.random() < 0.5) {
          obstacle.classList.add('bird-slow');
          type = 'bird-slow'; // Update type for movement logic
        } else {
          obstacle.classList.add('bird-fast');
          type = 'bird-fast'; // Update type for movement logic
        }
        obstacle.style.bottom = (100 + Math.random() * 80) + 'px'; // Random height between 100px and 180px
        obstacle.style.left = (1200 + Math.random() * 220) + 'px';
      }
      game.appendChild(obstacle);
      obstacles.push(obstacle);
    }

    // Function to create a group of birds
    function createBirdGroup() {
      for (let i = 0; i < BIRDS_IN_GROUP; i++) {
        const obstacle = document.createElement('div');
        obstacle.classList.add('obstacle');
        let type;
        if (Math.random() < 0.5) {
          obstacle.classList.add('bird-slow');
          type = 'bird-slow';
        } else {
          obstacle.classList.add('bird-fast');
          type = 'bird-fast';
        }
        obstacle.style.bottom = (100 + Math.random() * 80) + 'px'; // Random height
        // Stagger the birds horizontally
        obstacle.style.left = (1200 + i * 80 + Math.random() * 50) + 'px';
        game.appendChild(obstacle);
        obstacles.push(obstacle);
      }
    }

    // Function to create a group of bats
    function createBatGroup() {
      for (let i = 0; i < BATS_IN_GROUP; i++) {
        const obstacle = document.createElement('div');
        obstacle.classList.add('obstacle', 'bat');
        // Stagger the bats horizontally and vertically slightly
        obstacle.style.left = (1200 + i * 100 + Math.random() * 50) + 'px';
        obstacle.style.bottom = (100 + Math.random() * 40) + 'px'; // Random height around bat height
        game.appendChild(obstacle);
        obstacles.push(obstacle);
      }
    }

    function updateHighScoreDisplay() {
      // No longer needed to update during game
    }

    function updateLivesDisplay() {
      const livesEl = document.getElementById('lives');
      livesEl.innerHTML = '';
      for (let i = 0; i < lives; i++) {
        livesEl.innerHTML += '❤️';
      }
    }

    function updateProtectionCountDisplay() {
      const el = document.getElementById('protectionCount');
      el.innerHTML = '🛡️ ' + protectionUsesLeft;
    }

    function resetGame() {
      obstacles.forEach(obs => obs.remove());
      obstacles = [];
      dino.style.bottom = '0px';
      isJumping = false;
      jumpVelocity = 0;
      score = 0;
      gameOver = false;
      scoreValueEl.textContent = 0;
      gameoverEl.style.display = 'none';
      // Reset to day mode
      document.body.classList.remove('theme-desert', 'theme-lava', 'theme-ice', 'theme-night');
      currentThemeStateIndex = 0; // Reset to the first theme state
      currentObstacleInterval = INITIAL_OBSTACLE_INTERVAL; // Reset obstacle interval
      obstacleSpeed = 8; // Reset obstacle speed
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      lastFrameTime = null;
      lastObstacleTime = 0;
      lastBirdGroupTime = 0; // Reset bird group timer
      lastBatGroupTime = 0; // Reset bat group timer
      animationFrameId = requestAnimationFrame(gameLoop);
      // Apply initial theme state
      applyThemeState(THEME_STATES[currentThemeStateIndex]);
      // Do not update high score display here, only on game over
      lives = 4;
      updateLivesDisplay();
      protectionUsesLeft = 3;
      updateProtectionCountDisplay();
    }

    function endGame() {
      gameOver = true;
      gameoverEl.style.display = 'block';
      // Update high score in localStorage if current score is higher
      let storedHighScore = parseInt(localStorage.getItem('dinoHighScore')) || 0;
      if (score > storedHighScore) {
        highScore = score; // Update session high score variable too
        localStorage.setItem('dinoHighScore', highScore);
      }
      // Update the persistent high score display after game over
      updatePersistentHighScoreDisplay();
      // Display the highest score and restart message on the game over screen
      document.getElementById('final-high-score-value').textContent = highScore;
      document.getElementById('restart-message').textContent = 'Press Space to Restart';
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    function gameLoop(timestamp) {
      if (isPaused) {
        animationFrameId = requestAnimationFrame(gameLoop);
        return;
      }
      if (!lastFrameTime) lastFrameTime = timestamp;
      const delta = timestamp - lastFrameTime;
      lastFrameTime = timestamp;

      // Dino jump logic (time-based)
      let dinoBottom = parseFloat(dino.style.bottom) || 0;
      if (isJumping) {
        dinoBottom += jumpVelocity * (delta / 16.67);
        jumpVelocity -= gravity * (delta / 16.67);
        if (dinoBottom <= 0) {
          dinoBottom = 0;
          isJumping = false;
          canDoubleJump = false;
          dino.classList.add('landing');
          playLandSound();
          setTimeout(() => {
            dino.classList.remove('landing');
          }, 300);
        }
        dino.style.bottom = dinoBottom + 'px';
      }

      // Obstacle creation (time-based)
      lastObstacleTime += delta;
      if (lastObstacleTime > currentObstacleInterval) {
        createObstacle();
        lastObstacleTime = 0;
      }

      // Bird group creation (time-based)
      lastBirdGroupTime += delta;
      if (lastBirdGroupTime > BIRD_GROUP_INTERVAL) {
        createBirdGroup();
        lastBirdGroupTime = 0;
      }

      // Bat group creation (time-based)
      lastBatGroupTime += delta;
      if (lastBatGroupTime > BAT_GROUP_INTERVAL) {
        createBatGroup();
        lastBatGroupTime = 0;
      }

      // Move obstacles (time-based)
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        let obsLeft = parseFloat(obs.style.left);
        // Fast mini-zombie
        if (obs.classList.contains('mini-zombie')) {
          obsLeft -= (obstacleSpeed + 4) * (delta / 16.67);
        } else {
          obsLeft -= obstacleSpeed * (delta / 16.67);
        }
        // Birds have their own speed independent of obstacleSpeed
        if (obs.classList.contains('bird-slow')) {
          obsLeft -= 4 * (delta / 16.67); // Slow speed for slow birds
        } else if (obs.classList.contains('bird-fast')) {
          obsLeft -= 12 * (delta / 16.67); // Fast speed for fast birds
        }
        obs.style.left = obsLeft + 'px';
        // Spike ball bounces
        if (obs.classList.contains('spike-ball')) {
          let bounce = Math.abs(Math.sin(Date.now() / 200)) * 60;
          obs.style.bottom = (bounce) + 'px';
        }
        // Tall wall: no special movement
        // Falling rock: handled by CSS animation
        // ... rest of existing code ...
        // Remove if off screen
        if (obsLeft < -40) {
          obs.remove();
          obstacles.splice(i, 1);
          score++;
          scoreValueEl.textContent = score;
          playScoreSound();
          // Increase difficulty at regular intervals
          if (score % SPEED_INCREASE_INTERVAL === 0) {
            increaseDifficulty();
            console.log('Difficulty increased! Speed:', obstacleSpeed, 'Interval:', currentObstacleInterval);
          }
          // Check if score reaches the threshold for the next theme state
          if (currentThemeStateIndex + 1 < THEME_STATES.length && score >= THEME_STATES[currentThemeStateIndex + 1].scoreThreshold) {
            currentThemeStateIndex++;
            applyThemeState(THEME_STATES[currentThemeStateIndex]);
            console.log('Switched to theme state:', THEME_STATES[currentThemeStateIndex].theme, 'Night Mode:', THEME_STATES[currentThemeStateIndex].isNight);
          }
        } else {
          // Collision detection
          let dinoRect = dino.getBoundingClientRect();
          let obsRect = obs.getBoundingClientRect();
          // Refined collision detection with a small buffer
          const buffer = 5; // Adjust this value as needed
          if (
            dinoRect.right > obsRect.left + buffer &&
            dinoRect.left < obsRect.right - buffer &&
            dinoRect.bottom > obsRect.top + buffer &&
            dinoRect.top < obsRect.bottom - buffer
          ) {
            if (obs.classList.contains('protection')) {
              if (protectionUsesLeft > 0) {
                activateProtection();
                protectionUsesLeft--;
                updateProtectionCountDisplay();
              }
              obs.remove();
              obstacles.splice(i, 1);
              continue;
            }
            if (isProtected) {
              obs.remove();
              obstacles.splice(i, 1);
              continue;
            }
            if (obs.classList.contains('gun-powerup-normal')) {
              activateGun('normal');
              obs.remove();
              obstacles.splice(i, 1);
              continue;
            }
            if (obs.classList.contains('gun-powerup-laser')) {
              activateGun('laser');
              obs.remove();
              obstacles.splice(i, 1);
              continue;
            }
            if (obs.classList.contains('gun-powerup-shotgun')) {
              activateGun('shotgun');
              obs.remove();
              obstacles.splice(i, 1);
              continue;
            }
            if (obs.classList.contains('gun-powerup-cannon')) {
              activateGun('cannon');
              obs.remove();
              obstacles.splice(i, 1);
              continue;
            }
            playGameOverSound();
            obs.remove();
            obstacles.splice(i, 1);
            lives--;
            updateLivesDisplay();
            if (lives <= 0) {
              endGame();
            }
          }
        }
      }

      if (!gameOver) {
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (gameOver) {
          resetGame();
        } else {
          jump();
        }
      }
      if (e.code === 'KeyP') {
        isPaused = !isPaused;
        document.getElementById('pauseOverlay').style.display = isPaused ? 'block' : 'none';
      }
      if (e.code === 'KeyF') {
        shootBullet();
      }
    });

    // Function to apply a specific theme state
    function applyThemeState(state) {
      // Remove previous theme classes
      document.body.classList.remove('theme-desert', 'theme-lava', 'theme-ice', 'theme-night');
      // Add current theme classes
      if (state.theme !== 'default') {
        document.body.classList.add(state.theme);
      }
      if (state.isNight) {
        document.body.classList.add('theme-night');
      }
      // Update isNightMode flag
      isNightMode = state.isNight;
    }

    function activateProtection() {
      isProtected = true;
      dino.classList.add('protected');
      if (protectionTimeout) clearTimeout(protectionTimeout);
      protectionTimeout = setTimeout(() => {
        isProtected = false;
        dino.classList.remove('protected');
      }, 4000); // 4 seconds
    }

    function activateGun(type) {
      hasGun = true;
      gunType = type;
      gunTimeLeft = 8;
      dino.classList.remove('gun-normal', 'gun-laser', 'gun-shotgun', 'gun-cannon');
      dino.classList.add('gun-' + type);
      document.getElementById('gunTimer').style.display = 'block';
      document.getElementById('gunTimer').textContent = '🔫 ' + type.toUpperCase() + ' ' + gunTimeLeft;
      if (gunTimeout) clearTimeout(gunTimeout);
      if (gunTimerInterval) clearInterval(gunTimerInterval);
      gunTimerInterval = setInterval(() => {
        gunTimeLeft--;
        document.getElementById('gunTimer').textContent = '🔫 ' + type.toUpperCase() + ' ' + gunTimeLeft;
        if (gunTimeLeft <= 0) {
          deactivateGun();
        }
      }, 1000);
      gunTimeout = setTimeout(deactivateGun, 8000);
    }

    function deactivateGun() {
      hasGun = false;
      gunType = null;
      dino.classList.remove('gun-normal', 'gun-laser', 'gun-shotgun', 'gun-cannon');
      document.getElementById('gunTimer').style.display = 'none';
      if (gunTimeout) clearTimeout(gunTimeout);
      if (gunTimerInterval) clearInterval(gunTimerInterval);
    }

    function shootBullet() {
      if (!hasGun || !gunType) return;
      if (gunType === 'normal') {
        createBullet('bullet-normal', 18, 0, 0);
        playNormalGunSound();
      } else if (gunType === 'laser') {
        createBullet('bullet-laser', 32, 0, 0);
        playLaserGunSound();
      } else if (gunType === 'shotgun') {
        createBullet('bullet-shotgun', 14, 0, 0);
        createBullet('bullet-shotgun', 14, 8, 8);
        createBullet('bullet-shotgun', 14, -8, -8);
        playShotgunSound();
      } else if (gunType === 'cannon') {
        createBullet('bullet-cannon', 8, 0, 0);
        playCannonSound();
      }
    }

    function createBullet(className, speed, yOffset, angle) {
      const bullet = document.createElement('div');
      bullet.classList.add(className);
      bullet.style.left = (dino.offsetLeft + dino.offsetWidth - 4) + 'px';
      bullet.style.bottom = (parseFloat(dino.style.bottom) + 16 + yOffset) + 'px';
      game.appendChild(bullet);
      let dx = speed;
      let dy = angle ? Math.tan(angle * Math.PI / 180) * speed : 0;
      let bulletInterval = setInterval(() => {
        let left = parseFloat(bullet.style.left);
        let bottom = parseFloat(bullet.style.bottom);
        bullet.style.left = (left + dx) + 'px';
        bullet.style.bottom = (bottom + dy) + 'px';
        // Check collision with obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          let obsRect = obs.getBoundingClientRect();
          let bulletRect = bullet.getBoundingClientRect();
          if (
            bulletRect.right > obsRect.left &&
            bulletRect.left < obsRect.right &&
            bulletRect.bottom > obsRect.top &&
            bulletRect.top < obsRect.bottom
          ) {
            if (className === 'bullet-laser' || className === 'bullet-cannon') {
              // Laser and cannon destroy all obstacles in their path
              obs.remove();
              obstacles.splice(i, 1);
            } else {
              obs.remove();
              obstacles.splice(i, 1);
              bullet.remove();
              clearInterval(bulletInterval);
              return;
            }
          }
        }
        // Remove bullet if off screen
        if (left > 1200 || left < 0) {
          bullet.remove();
          clearInterval(bulletInterval);
        }
      }, 16);
    }

    // Function to update the persistent high score display
    function updatePersistentHighScoreDisplay() {
      const persistentHighScoreEl = document.getElementById('persistent-high-score');
      const storedHighScore = parseInt(localStorage.getItem('dinoHighScore')) || 0;
      persistentHighScoreEl.textContent = 'HI: ' + storedHighScore;
    }

    // Start the game
    // Mobile controls: show/hide and orientation handling
    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    const mobileControlsEl = document.getElementById('mobileControls');
    const orientationHintEl = document.getElementById('orientationHint');
    const jumpBtn = document.getElementById('jumpBtn');
    const shootBtn = document.getElementById('shootBtn');

    function updateMobileUI() {
      if (!isTouchDevice) {
        if (mobileControlsEl) mobileControlsEl.style.display = 'none';
        if (orientationHintEl) orientationHintEl.style.display = 'none';
        return;
      }
      const isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        if (orientationHintEl) orientationHintEl.style.display = 'flex';
        if (mobileControlsEl) mobileControlsEl.style.display = 'none';
      } else {
        if (orientationHintEl) orientationHintEl.style.display = 'none';
        if (mobileControlsEl) mobileControlsEl.style.display = 'flex';
      }
    }

    // Wire touch/click events for mobile buttons
    if (jumpBtn) {
      jumpBtn.addEventListener('touchstart', (ev) => { ev.preventDefault(); if (!gameOver) jump(); }, {passive:false});
      jumpBtn.addEventListener('pointerdown', (ev) => { ev.preventDefault(); if (!gameOver) jump(); });
      jumpBtn.addEventListener('click', (ev) => { if (!gameOver) jump(); });
    }
    if (shootBtn) {
      shootBtn.addEventListener('touchstart', (ev) => { ev.preventDefault(); shootBullet(); }, {passive:false});
      shootBtn.addEventListener('pointerdown', (ev) => { ev.preventDefault(); shootBullet(); });
      shootBtn.addEventListener('click', (ev) => { shootBullet(); });
    }

    window.addEventListener('resize', updateMobileUI);
    window.addEventListener('orientationchange', updateMobileUI);
    // Initial UI setup
    updateMobileUI();

    // Start the game
    resetGame();
    // Display the persistent high score on page load
    updatePersistentHighScoreDisplay();
  </script>
